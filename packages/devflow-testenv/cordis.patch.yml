# The testenv bundle patch: the `dsh.bundle.patch` layer of this package.
#
# `dsh plugin --profile <name> add @zhchxiao123/dsh-devflow-testenv` installs
# the package, and this patch is what mounts it — no profile editing. testenv
# injects only `tools`, `subprocess`, and `skills`, so the row composes into
# any profile that carries those seams, with or without the devflow bundle.
- insert:
    # The environment orchestrator: testenv.yml manifest, the env_* tools with
    # integration_test, and the bundled testenv-bootstrap skill. Config is
    # optional — every field has a documented default.
    - id: testenv
      name: '@zhchxiao123/dsh-devflow-testenv'
