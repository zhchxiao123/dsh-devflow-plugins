# The worktree bundle patch: the `dsh.bundle.patch` layer of this package.
#
# `dsh plugin --profile <name> add @zhchxiao123/dsh-devflow-worktree` installs
# the package, and this patch is what mounts it — no profile editing. The
# package injects only `skills`; the transition fence reaches the optional
# `devflow` service by name and stays inert in a profile without one, so the
# row composes into any profile that carries a skill registry.
- insert:
    # The bundled devflow-worktree-runbook skill plus the worktree fence. The
    # fence holds a card carrying a `worktree` dispatch artifact to its own
    # worktree, and cards without one are untouched — mounting this row changes
    # nothing until a card is actually dispatched.
    - id: devflow-worktree
      name: '@zhchxiao123/dsh-devflow-worktree'
